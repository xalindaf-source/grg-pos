<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: brand bar on top, one working column, tab bar at the bottom. Forest green on green-tinted neutrals. */
:root{--brand:#14613a;--brand-ink:#ffffff;--brand-soft:#e3efe7;--hdr:#0f4a2d;--hdr-ink:#ffffff;
--bg:#f2f5f2;--desk:#dde5df;--surface:#ffffff;--line:#dce5de;--text:#16241c;--muted:#5f7066;

--shadow:0 1px 2px rgba(15,40,25,.06),0 4px 14px rgba(15,40,25,.05);
--font-display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
--font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#52ad7b;--brand-ink:#08150d;--brand-soft:#17321f;--hdr:#12281d;--hdr-ink:#e9f3ed;
--bg:#0c140f;--desk:#070c09;--surface:#141f18;--line:#24362b;--text:#e5efe8;--muted:#92a79b;--warn:#e5a847;--warn-soft:#3a2d12;--bad:#f08178;--bad-soft:#3b1c19;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--brand:#52ad7b;--brand-ink:#08150d;--brand-soft:#17321f;--hdr:#12281d;--hdr-ink:#e9f3ed;
--bg:#0c140f;--desk:#070c09;--surface:#141f18;--line:#24362b;--text:#e5efe8;--muted:#92a79b;--warn:#e5a847;--warn-soft:#3a2d12;--bad:#f08178;--bad-soft:#3b1c19;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14.5px/1.45 var(--font-body);background:var(--bg);color:var(--text);padding-bottom:84px;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance}
.ic{width:20px;height:20px;flex:none;vertical-align:-4px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{background:var(--hdr);color:var(--hdr-ink);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:11px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(15,40,25,.06)}

.b{background:var(--brand);color:var(--brand-ink);border:0;border-radius:11px;padding:11px 15px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s}

.line{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}

.prow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}

.chip.low,.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.out,.chip.unpaid{background:var(--bad-soft);color:var(--bad)}
.chip.paid{background:var(--brand-soft);color:var(--brand)}
.right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.right .row{flex-wrap:nowrap;gap:6px}.right .row .b{white-space:nowrap;padding:7px 9px}.prow>div:first-child{min-width:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

.sheet{background:var(--surface);color:var(--text);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:14px;font-weight:600;z-index:50;display:none;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3)}

#cartbar .cbi{position:relative;display:inline-grid;place-items:center}
#cartbar .cbi em{position:absolute;top:-8px;right:-10px;background:var(--brand-ink);color:var(--brand);border-radius:10px;font-style:normal;font-size:11px;font-weight:800;padding:0 6px;min-width:18px;text-align:center}
#cartbar .cbt{font-family:var(--font-display);font-size:20px}
main.hasbar{padding-bottom:92px}
.shd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.shd h2{margin:0}
.iconbtn2{border:0;background:var(--brand-soft);color:var(--brand);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;padding:0}
.iconbtn2 .ic{width:18px;height:18px;vertical-align:0}
#docview{position:fixed;inset:0;z-index:25;background:var(--desk);display:none;flex-direction:column}
#docview.on{display:flex}
.dvtop{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.dvtop b{font-family:var(--font-display);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvbody{flex:1;overflow:auto;padding:16px 12px}
.paper{background:#fff;color:#111;max-width:640px;margin:0 auto;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:6px}
.paper .inv{padding:14px;font-size:12.5px}
.dvmore{display:none;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.dvmore.on{display:flex}
.dvmore .b{flex:1;white-space:nowrap}
.dvbar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.dvbar .b{flex:1}
.dvbar .nf{flex:none;padding:11px 14px}
#printarea{display:none}
a.b{display:inline-flex}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block!important}body{background:#fff!important;padding:0!important}.inv{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.sheet{border-radius:20px;margin-bottom:6vh;align-self:center}#modal{align-items:center}}
.inv .lg{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#1f6f43;color:#fff;margin-bottom:6px}
.inv .lg svg{width:20px;height:20px}
.inv{background:#fff;color:#111;font:13px/1.45 system-ui,Arial,sans-serif;padding:6px}
.inv h1{font-size:22px;margin:0;color:#1f6f43;letter-spacing:.5px}
.inv .top{display:flex;justify-content:space-between;gap:14px;margin-bottom:14px}
.inv .meta{text-align:right}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}
.inv th{background:#1f6f43;color:#fff;text-align:left;padding:6px 7px;font-size:12px}

.inv .totals{margin-left:auto;width:230px}
.inv .totals div{display:flex;justify-content:space-between;padding:3px 0}
.inv .totals .g{font-weight:700;font-size:15px;border-top:2px solid #1f6f43;margin-top:3px;padding-top:6px}
.inv .stamp{display:inline-block;border:2px solid #1f6f43;color:#1f6f43;padding:2px 10px;border-radius:5px;font-weight:700;transform:rotate(-4deg);margin-top:6px}

.inv .foot{margin-top:16px;color:#555;font-size:12px;white-space:pre-line}
</style>

<body>
<header id="hdr"></header>
<div id="banner"></div>
<main id="main"><div class="empty">Loading…</div></main>
<div id="cartbar"></div>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="docview"></div>
<div id="printarea"></div>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const R=n=>{const [a,b]=(Math.round(num(n)*100)/100).toFixed(2).split('.');return 'R'+a.replace(/\B(?=(\d{3})+$)/g,' ')+'.'+b};
const dFmt=ts=>new Date(ts).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});
const newId=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const byName=(a,b)=>String(a.name).localeCompare(String(b.name));
const DEF={name:'Garden Route Green',address:'',phone:'',email:'',vatNo:'',vatOn:false,bank:'',nextInv:1,cover:14,staff:['Xalinda','Xavier','Alinda','Alex'],footer:'Thank you for your business!'};

const S={products:[],sales:[],invoices:[],settings:{},cart:[],tab:'sell',q:'',q2:'',cat:'',cat2:'',by:'',cust:{name:'',phone:'',address:''},pay:'Cash',range:'today',loaded:{},rate:{},busy:false};
let DB=null,DL=null;
const st=()=>Object.assign({},DEF,S.settings);
const prod=id=>S.products.find(p=>p.id===id);

/* ---------- storage (saved in this browser) ---------- */
const LS='garden-route-green-data';
function persist(){try{localStorage.setItem(LS,JSON.stringify({products:S.products,sales:S.sales,invoices:S.invoices,settings:S.settings}))}catch(e){note('This browser could not save your data. Use Settings > Back up data often.')}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.products=d.products||[];S.sales=d.sales||[];S.invoices=d.invoices||[];S.settings=d.settings||{}}}catch(e){}}
async function put(c,id,data){
  if(DB){await DB.collection(c).doc(id).set(data)}
  else{const a=S[c],i=a.findIndex(x=>x.id===id),o=Object.assign({id},data);if(i<0)a.unshift(o);else a[i]=o;persist()}
}
async function upd(c,id,patch){
  if(DB){await DB.collection(c).doc(id).update(patch)}
  else{Object.assign(S[c].find(x=>x.id===id)||{},patch);persist()}
}
async function del(c,id){
  if(DB){await DB.collection(c).doc(id).delete()}
  else{S[c]=S[c].filter(x=>x.id!==id);persist()}
}
function sub(name,key,order){
  let q=DB.collection(name);
  if(order)q=q.orderBy(order,'desc').limit(1000);
  const t=setTimeout(()=>{if(!S.loaded[key]){S.loaded[key]=1;note('Data is slow to load – showing what is available.');render()}},10000);
  q.onSnapshot(s=>{clearTimeout(t);S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded[key]=1;render()},
    ()=>{S.loaded[key]=1;note('Could not load '+name+'.');render()});
}
function note(t){const b=$('#banner');b.textContent=t;b.style.display=t?'block':'none'}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

/* ---------- derived stock info ---------- */
function derive(){
  const now=Date.now(),cut=now-30*864e5;let old=now;const m={};
  for(const s of S.sales){if(s.ts<cut)continue;old=Math.min(old,s.ts);for(const i of (s.items||[]))m[i.pid]=(m[i.pid]||0)+num(i.qty)}
  const days=Math.min(30,Math.max(7,(now-old)/864e5));
  S.rate={};for(const k in m)S.rate[k]=m[k]/days;
}
function info(p){
  const stock=num(p.stock),min=num(p.min),rate=S.rate[p.id]||0,cover=rate>0?stock/rate:Infinity;
  let s='ok';
  if(stock<=0)s='out';else if(stock<=min)s='low';else if(cover<7)s='soon';
  const target=Math.max(min*2,Math.ceil(rate*st().cover));
  const pack=Math.max(1,num(p.pack)||1);
  let qty=Math.max(0,target-stock);qty=Math.ceil(qty/pack)*pack;
  if(s!=='ok'&&qty<=0)qty=pack;
  return{s,stock,min,rate,cover,qty,cost:qty*num(p.cost)};
}
const LBL={ok:'In stock',soon:'Running low',low:'Low',out:'Out'};

/* ---------- icons (24px line icons) ---------- */
const IC={
 cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
 box:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
 truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
 doc:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
 chart:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
 sliders:'<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
 minus:'<path d="M5 12h14"/>',

function catChips(key){

function pairDiscount(qty, price, pairPrice){
  return pairPrice==null ? 0 : Math.floor(Math.max(0,num(qty))/2) *
    Math.max(0,2*Math.round(num(price)*100)-Math.round(num(pairPrice)*100))/100;
}
function cartDiscount(c){
  const pairPrice=prod(c.pid)?.pairPrice;
  let previous=0;
  for(const line of S.cart){
    if(line===c)break;
    if(line.pid===c.pid&&line.price===c.price)previous+=Math.floor(Math.max(0,num(line.qty)));
  }
  return pairDiscount(previous+Math.floor(Math.max(0,num(c.qty))),c.price,pairPrice)-
    pairDiscount(previous,c.price,pairPrice);
}
const flavourCount=(p,name)=>p.flavourStock?.find(row=>row.name===name)?.qty??0;
function stockPatch(p,name,delta){
  const stock=Math.max(0,num(p.stock)+delta);
  if(!p.flavourStock||!p.flavours.includes(name))return {stock};
  return {stock,flavourStock:p.flavours.map(flavour=>({
    name:flavour,qty:flavourCount(p,flavour)+(flavour===name?delta:0)
  }))};
}
const flavourNames=value=>[...new Set(value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];

function addCartLine(p,flavour=''){

function report(){
  const now=new Date();const sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const from=S.range==='today'?sod:Date.now()-(S.range==='week'?7:30)*864e5;
  const sales=S.sales.filter(s=>s.ts>=from).sort((a,b)=>b.ts-a.ts);
  const rev=sales.reduce((a,s)=>a+num(s.total),0);
  const cogs=sales.reduce((a,s)=>a+(s.items||[]).reduce((b,i)=>b+num(i.qty)*num(i.cost),0),0);
  const top={};sales.forEach(s=>(s.items||[]).forEach(i=>{const t=top[i.pid]||(top[i.pid]={name:i.name,qty:0,rev:0});t.qty+=num(i.qty);t.rev+=lineTotal(i)}));
  const tl=Object.values(top).sort((a,b)=>b.rev-a.rev).slice(0,5);
  const chip=(k,l)=>`<button class="${S.range===k?'on':''}" data-a="range" data-r="${k}">${l}</button>`;
  let h=`<div class="chips">${chip('today','Today')}${chip('week','7 days')}${chip('month','30 days')}</div>
  <div class="kpis"><div class="kpi"><small>Sales</small><b>${R(rev)}</b></div><div class="kpi"><small>Est. profit</small><b>${R(rev-cogs)}</b></div><div class="kpi"><small>No. of sales</small><b>${sales.length}</b></div><div class="kpi"><small>Cost of goods</small><b>${R(cogs)}</b></div></div>`;
  const bc={};sales.forEach(s=>(s.items||[]).forEach(i=>{const k=i.cat||(prod(i.pid)||{}).category||'Uncategorised';const t=bc[k]||(bc[k]={qty:0,rev:0});t.qty+=num(i.qty);t.rev+=lineTotal(i)}));
  const bp={};sales.forEach(x=>{const k=x.by||'Not recorded';const t=bp[k]||(bp[k]={n:0,rev:0});t.n++;t.rev+=num(x.total)});
  const pl=Object.entries(bp).sort((a,b)=>b[1].rev-a[1].rev);
  if(pl.length>1||(pl.length===1&&pl[0][0]!=='Not recorded'))h+='<section class="card"><h3>Sales by salesperson</h3>'+pl.map(([k,t])=>`<div class="prow"><div>${esc(k)}<div class="sub">${t.n} sale${t.n===1?'':'s'}</div></div><b>${R(t.rev)}</b></div>`).join('')+'</section>';
  const cl=Object.entries(bc).sort((a,b)=>b[1].rev-a[1].rev);
  if(cl.length>1||(cl.length===1&&cl[0][0]!=='Uncategorised'))h+='<section class="card"><h3>Sales by category</h3>'+cl.map(([k,t])=>`<div class="prow"><div>${esc(k)}<div class="sub">${t.qty} sold</div></div><b>${R(t.rev)}</b></div>`).join('')+'</section>';
  if(tl.length)h+='<section class="card"><h3>Top sellers</h3>'+tl.map(t=>`<div class="prow"><div>${esc(t.name)}<div class="sub">${t.qty} sold</div></div><b>${R(t.rev)}</b></div>`).join('')+'</section>';
  h+='<section class="card"><h3>Sales</h3>'+(sales.length?sales.slice(0,60).map(s=>{const hasInv=S.invoices.find(v=>v.saleId===s.id);return `<div class="prow"><div><b>${R(s.total)}</b> <span class="sub">· ${esc(s.pay||'')}${s.by?' · by '+esc(s.by):''}</span><div class="sub">${new Date(s.ts).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${s.customer?' · '+esc(s.customer):''}</div><div class="sub">${(s.items||[]).map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div></div>
    <div class="right">${hasInv?`<button class="b alt sm nf" data-a="invopen" data-id="${hasInv.id}">${esc(hasInv.no)}</button>`:`<button class="b alt sm nf" data-a="saleinv" data-id="${s.id}">Invoice</button>`}${pinOwner()?`<button class="b red sm nf" data-a="void" data-id="${s.id}">Void</button>`:''}</div></div>`}).join(''):'<div class="empty">No sales in this period.</div>')+'</section>';
  return h;
}

const HB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const pdfClean=t=>String(t==null?'':t).replace(/[–—]/g,'-').replace(/×/g,'x').replace(/[·•]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7e\xa0-\xff]/g,'?');
const pdfEsc=t=>t.replace(/[\\()]/g,m=>'\\'+m);
const textW=(t,size,bold)=>{const T=bold?HB:HW;let w=0;for(const ch of t){const c=ch.charCodeAt(0);w+=(c>=32&&c<=126)?T[c-32]:556}return w/1000*size*0.3528};
function wrapText(t,max,size){
  t=pdfClean(t);const out=[];
  for(const para of t.split('\n')){let line='';
    for(const w of para.split(' ')){const tryl=line?line+' '+w:w;if(line&&textW(tryl,size)>max){out.push(line);line=w}else line=tryl}
    out.push(line)}
  return out;
}
function pdfDoc(){
  const pages=[[]],f=n=>String(Math.round(n*100)/100),mm=v=>v*2.8346,cur=()=>pages[pages.length-1],col=c=>c.map(x=>f(x/255)).join(' ');
  return{
    addPage(){pages.push([])},
    text(x,y,t,o){o=o||{};const size=o.size||10;t=pdfClean(t);let px=mm(x);if(o.align==='r')px-=mm(textW(t,size,o.bold));
      cur().push(`BT /${o.bold?'F2':'F1'} ${size} Tf ${col(o.color||[0,0,0])} rg ${f(px)} ${f(841.89-mm(y))} Td (${pdfEsc(t)}) Tj ET`)},
    rect(x,y,w,h,c){cur().push(`${col(c)} rg ${f(mm(x))} ${f(841.89-mm(y+h))} ${f(mm(w))} ${f(mm(h))} re f`)},
    line(x1,y1,x2,y2,c){cur().push(`${col(c)} RG 0.5 w ${f(mm(x1))} ${f(841.89-mm(y1))} m ${f(mm(x2))} ${f(841.89-mm(y2))} l S`)},
    build(){
      const objs=[],add=x=>{objs.push(x);return objs.length};
      add('<< /Type /Catalog /Pages 2 0 R >>');add('');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids=[];
      pages.forEach(p=>{const c=p.join('\n');const ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
        const pi=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`);kids.push(pi+' 0 R')});
      objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
      let out='%PDF-1.4\n';const offs=[];
      objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
      const xr=out.length;
      out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
    }
  };
}
function buildPdf(o){
  const P=pdfDoc(),L=16,Rm=194,G=[31,111,67],GREY=[80,80,80];let y=20;
  P.text(L,y,o.title,{size:18,bold:true,color:G});
  let yl=y+7;(o.head||[]).forEach(t=>{wrapText(t,100,10).forEach(l=>{P.text(L,yl,l,{size:10,color:GREY});yl+=5})});
  let ym=y-1;(o.meta||[]).forEach((t,i)=>{P.text(Rm,ym,t,{size:i===0?14:10,bold:i<2,align:'r',color:i===0?G:[0,0,0]});ym+=i===0?7:5});
  y=Math.max(yl,ym)+4;
  if(o.billto&&o.billto.length){P.text(L,y,'Bill to',{bold:true});y+=5;o.billto.forEach(t=>{P.text(L,y,t);y+=5});y+=2}
  const hdr=()=>{P.rect(L,y-4.8,Rm-L,7,G);o.cols.forEach(c=>P.text(c.x,y,c.t,{size:9,bold:true,color:[255,255,255],align:c.a}));y+=7};
  hdr();
  o.rows.forEach(r=>{
    const lines=wrapText(r[0],o.cols[0].w,10),h=Math.max(1,lines.length)*5;
    if(y+h>272){P.addPage();y=20;hdr()}
    lines.forEach((ln,i)=>P.text(o.cols[0].x,y+i*5,ln,{size:10}));
    for(let j=1;j<o.cols.length;j++)P.text(o.cols[j].x,y,r[j],{size:10,align:o.cols[j].a});
    y+=h;P.line(L,y-3.4,Rm,y-3.4,[221,228,223]);
  });
  y+=3;
  (o.totals||[]).forEach((t,i,a)=>{const last=i===a.length-1;
    if(y>272){P.addPage();y=20}
    if(last){P.line(130,y-4.6,Rm,y-4.6,G);y+=1}
    P.text(132,y,t[0],{size:last?12:10,bold:last});P.text(Rm-2,y,t[1],{size:last?12:10,bold:last,align:'r'});y+=last?7:5.5});
  y+=4;
  (o.foot||[]).forEach(t=>{wrapText(t,Rm-L,9.5).forEach(l=>{if(y>280){P.addPage();y=20}P.text(L,y,l,{size:9.5,color:GREY});y+=4.6});y+=1.5});
  return P.build();
}
function invPdfData(v){

  const head=[].concat((b.address||'').split('\n').filter(Boolean),[[b.phone,b.email].filter(Boolean).join('   ')].filter(Boolean),v.vatOn&&b.vatNo?['VAT No: '+b.vatNo]:[]);
  return{title:b.name||'Invoice',head,
    meta:[v.vatOn?'TAX INVOICE':'INVOICE',v.no,dFmt(v.ts)].concat(v.by?['Served by: '+v.by]:[],[v.status==='paid'?'PAID':'UNPAID']),
    billto:[c.name,c.address,c.phone].filter(Boolean),
    cols:[{t:'Description',x:L0+2,a:'l',w:92},{t:'Qty',x:128,a:'r'},{t:'Unit price',x:160,a:'r'},{t:'Amount',x:192,a:'r'}],

    foot:[].concat(b.bank?['Banking details:\n'+b.bank]:[],b.footer?[b.footer]:[])};
}

async function sharePdf(name,bytes){
  const blob=new Blob([bytes],{type:'application/pdf'});
  try{
    const f=new File([blob],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast('PDF saved to your downloads');
}
function printHtml(html){
  const pa=$('#printarea');pa.innerHTML=html;let ok=false;
  const mark=()=>{ok=true};
  window.addEventListener('beforeprint',mark,{once:true});
  const mq=window.matchMedia&&window.matchMedia('print');if(mq&&mq.addEventListener)mq.addEventListener('change',mark,{once:true});
  try{window.print()}catch(e){}
  setTimeout(()=>{window.removeEventListener('beforeprint',mark);if(!ok){toast('Could not open printing. Use More > Save PDF instead.')}},1200);
}

async function makeInvoice(items,total,pay,cust,saleId,by){
  const s=st();const n=num(s.nextInv)||1;
  const inv={no:'INV-'+String(n).padStart(4,'0'),ts:Date.now(),customer:{name:cust.name||'',phone:cust.phone||'',address:cust.address||''},items,total,
    vatOn:!!s.vatOn,status:pay==='On account'?'unpaid':'paid',saleId:saleId||'',by:by||'',
    biz:{name:s.name,address:s.address,phone:s.phone,email:s.email,vatNo:s.vatNo,bank:s.bank,footer:s.footer}};
  const id=newId();await put('invoices',id,inv);
  await saveSettings(Object.assign({},s,{nextInv:n+1}));
  return Object.assign({id},inv);
}

const A={
  tab(d){S.tab=d.t;render();scrollTo(0,0)},
  close(){closeModal()},
  cartopen(){if(!S.cart.length)return;S.cartOpen=true;openModal(cartSheet());drawCartBar()},
  add(d){
    const p=prod(d.id);if(!p)return;
    if(!p.flavours?.length){addCartLine(p);return}

  },
  addflavour(d){
    const p=prod(d.id), flavour=p?.flavours?.[Number(d.option)];
    if(!flavour)return;
    if(p.flavourStock&&flavourCount(p,flavour)<=num(S.cart.find(c=>c.pid===p.id&&c.flavour===flavour)?.qty)){toast('No more '+flavour+' in stock');return}

  },
  cq(d){const c=S.cart.find(x=>x.id===d.id);if(!c)return;c.qty=Math.max(0,num(c.qty)+num(d.d));if(c.qty<=0)S.cart=S.cart.filter(x=>x!==c);cartChanged()},
  crm(d){S.cart=S.cart.filter(x=>x.id!==d.id);cartChanged()},
  clear(){S.cart=[];S.cust={name:'',phone:'',address:''};cartChanged()},

    const pairPrice=pairInput===''?null:num(pairInput);

    const flavourStock=flavours.map((name,i)=>({name,qty:$('#f_flavour_count_'+i).valueAsNumber}));
    if(flavourStock.some(row=>!Number.isSafeInteger(row.qty)||row.qty<0)){toast('Enter a whole stock count for every flavour');return}

  },
  async recvsave(d){
    const p=prod(d.id),q=num(val('r_qty'));if(!p||q<=0){toast('Enter a quantity');return}

  pimport(){openModal(`<h2>Import products</h2><p class="sub">One product per line, separated by commas or tabs (paste straight from a spreadsheet):<br><b>Name, selling price, cost price, stock, reorder level, supplier, category</b><br>Only the name is required. Names can't contain commas.</p>

  async pimportgo(){

  async legacyStock(){
    if(!pinOwner()||S.busy)return;
    const button=document.querySelector('[data-a="legacyStock"]');
    S.busy=true;
    if(button)button.disabled=true;
    try{
      const response=await fetch("https://script.google.com/macros/s/AKfycbwVllVYwzsFSF0VD0lOIuo8X9sNX3Y9ZJ_TR8ebOmrf4OBrlUuUuG6XXaQwJiWed9EQ/exec?action=getStock",{signal:AbortSignal.timeout(25000),cache:'no-store'});
      if(!response.ok)throw new Error('Stock request failed');
      const source=await response.json();
      if(source.status!=='ok'||!Array.isArray(source.data)||!source.data.length)throw new Error('No stock returned');
      if(!pinOwner())return;
      const key=value=>String(value??'').trim().toLowerCase();
      const signature=(name,supplier)=>JSON.stringify([key(name),key(supplier)]);
      const existing=JSON.parse(localStorage.getItem(LS)||'null');
      const products=existing?.products||S.products;
      const ids=new Set(products.map(p=>p.id));
      const skus=new Set(products.map(p=>key(p.sku)).filter(Boolean));
      const names=new Set(products.map(p=>signature(p.name,p.supplier)));
      const added=[];
      for(const row of source.data){
        const name=String(row.product??'').trim();
        const supplier=String(row.supplier??'').trim();
        const sku=String(row.sku??'').trim();
        if(!name)throw new Error('A product was missing its name');
        const match=signature(name,supplier);
        const id='old-stock-'+encodeURIComponent(sku?key(sku):match);
        if(ids.has(id)||(sku&&skus.has(key(sku)))||names.has(match))continue;
        added.push({id,sku,name,supplier,category:String(row.category??'').trim(),
          price:num(row.retail),cost:num(row.purchase),stock:num(row.inStock),min:num(row.minLevel),unit:'',pack:1});
        ids.add(id);
        if(sku)skus.add(key(sku));else names.add(match);
      }
      if(!added.length){toast('These products are already in your app');return}
      const next={products:[...products,...added],sales:existing?.sales||S.sales,
        invoices:existing?.invoices||S.invoices,settings:existing?.settings||S.settings};
      localStorage.setItem(LS,JSON.stringify(next));
      Object.assign(S,next);
      closeModal();
      render();
      toast(added.length+' products imported'+(source.data.length>added.length?' · '+(source.data.length-added.length)+' already present':''));
    }catch(error){
      toast('Could not import old products. Check your connection and try again.');
    }finally{
      S.busy=false;
      if(button)button.disabled=false;
    }
  },
  backup(){
    const blob=new Blob([JSON.stringify({products:S.products,sales:S.sales,invoices:S.invoices,settings:S.settings})],{type:'application/json'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='garden-route-green-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Backup saved to your downloads');
  },

    await saveSettings(o);closeModal();toast('Settings saved');render();
  }
};
A.void=function(d){const s=S.sales.find(x=>x.id===d.id);if(!s)return;ask('Void this sale and put the items back in stock?','voidgo',d.id)};
A.voidgo=async function(d){
  const s=S.sales.find(x=>x.id===d.id);if(!s)return;
  for(const i of s.items){const p=prod(i.pid);if(p)await upd('products',p.id,stockPatch(p,i.flavour,num(i.qty)))}
  await del('sales',s.id);closeModal();toast('Sale voided');render();
};

async function doCheckout(withInv){
  if(S.busy)return;
  const lines=S.cart.filter(c=>num(c.qty)>0&&prod(c.pid));
  if(!lines.length){toast('Cart is empty');return}
  for(const line of lines){
    const p=prod(line.pid);
    if(p.flavourStock&&(!p.flavours.includes(line.flavour)||!Number.isSafeInteger(num(line.qty))||num(line.qty)>flavourCount(p,line.flavour))){
      toast('Check stock for '+p.name+(line.flavour?' · '+line.flavour:''));return;
    }
  }
  S.busy=true;
  try{
    const items=lines.map(c=>{const p=prod(c.pid);return{pid:c.pid,name:c.flavour?p.name+' · '+c.flavour:p.name,flavour:c.flavour,cat:p.category||'',unit:p.unit||'',qty:num(c.qty),price:num(c.price),discount:cartDiscount(c),cost:num(p.cost)}});
    const total=items.reduce((a,i)=>a+lineTotal(i),0);
    const saleId=newId();
    await put('sales',saleId,{ts:Date.now(),items,total,pay:S.pay,customer:S.cust.name.trim(),by:S.by.trim()});
    for(const i of items){const p=prod(i.pid);if(p)await upd('products',p.id,stockPatch(p,i.flavour,-i.qty))}
    let inv=null;
    if(withInv)inv=await makeInvoice(items,total,S.pay,S.cust,saleId,S.by.trim());
    S.cart=[];S.cust={name:'',phone:'',address:''};
    closeModal();render();
    if(inv)showInvoice(inv);else toast('Sale complete – '+R(total));
  }catch(e){toast('Something went wrong – please try again')}
  S.busy=false;
}

/* ---------- device PINs ---------- */
const PIN_KEY='garden-route-green-device-pins';
const validPin=value=>/^\d{6}$/.test(value);
let pinUsers=[], pinUser=null, pinBusy=false, failedPins=0, retryAt=0;
const pinSlots=[0,5,1,2];
const pinOwner=()=>!pinUsers.length||pinUser?.slot===0||pinUser?.slot===5;
const restrictedActions=new Set(['settings','pinsetup','legacyStock','backup','ssave','pdelask','pdel','cats','catadd','catdel','invdel','invdelgo','void','voidgo']);
const shopBrand=`<div class="brand"><span class="logo">${ico('leaf')}</span><div><h1>Garden Route Green</h1><small>Sales, stock and invoices</small></div></div>`;

function hex(bytes){return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
async function pinHash(pin,salt){
  const encoder=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',encoder.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:encoder.encode(salt),iterations:600000},key,256);
  return hex(new Uint8Array(bits));
}

function pinHeader(){
  $('#hdr').innerHTML=shopBrand+
    (pinOwner()?'<button class="iconbtn" data-a="settings" aria-label="Settings">'+ico('sliders')+'</button>':'')+
    (pinUser?'<button class="b alt sm nf" data-a="lockpin">Lock till</button>':'');
}
function lockTill(){
  if(S.busy||pinBusy)return;
  pinUser=null;
  Object.assign(S,{by:'',cart:[],cust:{name:'',phone:'',address:''},q:'',q2:'',cat:'',cat2:'',tab:'sell',pay:'Cash'});
  closeModal();closeDoc();$('#printarea').replaceChildren();
  pinHeader();render();
}
function pinLoginForm(){

    <h2>Unlock till</h2>
    <label for="pin-person">Name</label><select id="pin-person">${pinUsers.map(u=>`<option value="${u.slot}">${esc(u.name)}</option>`).join('')}</select>
    <label for="pin-login-code">6-digit PIN</label><input id="pin-login-code" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required>
    <p class="sub" role="status" id="pin-login-status"></p>
    <button class="b" type="submit">Unlock</button>

}
function pinSetupForm(){
  return `<form id="pin-setup">
    <h2>${pinUsers.length?'Manage staff PINs':'Set up PIN login'}</h2>
    <p class="sub">PINs work on this browser. Keep your owner PIN somewhere safe.</p>
    ${pinSlots.map(slot=>{
      const user=pinUsers.find(u=>u.slot===slot);
      return `<div class="two"><div><label for="pin-name-${slot}">${slot===0?'Owner 1':slot===5?'Owner 2':'Staff '+slot} name</label><input id="pin-name-${slot}" maxlength="60" value="${esc(user?.name||(slot===0?'Xalinda':''))}" ${slot===0?'required':''}></div>
      <div><label for="pin-code-${slot}">6-digit PIN</label><input id="pin-code-${slot}" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" placeholder="${user?'Keep current PIN':'Enter PIN'}" ${slot===0&&!user?'required':''}></div></div>`;
    }).join('')}
    <label for="pin-confirm">Confirm new owner PIN</label><input id="pin-confirm" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" placeholder="Only when setting a new owner PIN">
    <p class="sub" role="status" id="pin-setup-status"></p>
    <div class="row"><button class="b" type="submit">${pinUsers.length?'Save PINs and lock':'Turn on PIN login'}</button><button class="b alt nf" type="button" data-a="settings">Cancel</button></div>
  </form>`;
}
async function savePins(){
  if(!pinOwner())return;
  const status=$('#pin-setup-status'), next=[], names=new Set();
  const ownerPin=val('pin-code-0');
  if(ownerPin!==val('pin-confirm')){status.textContent='Enter the same owner PIN twice.';return}
  for(const slot of pinSlots){
    const name=val('pin-name-'+slot).trim(), pin=val('pin-code-'+slot);
    const previous=pinUsers.find(u=>u.slot===slot);
    if(slot>0&&!name&&!pin)continue;
    if(!name||(!previous&&!validPin(pin))||(pin&&!validPin(pin))){
      status.textContent='Enter a name and a 6-digit PIN for each person you want to add.';return;
    }
    if(names.has(name.toLowerCase())){status.textContent='Give each person a different name.';return}
    names.add(name.toLowerCase());
    if(pin){
      const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
      next.push({slot,name,salt,hash:await pinHash(pin,salt)});
    }else next.push({...previous,name});
  }
  localStorage.setItem(PIN_KEY,JSON.stringify(next));
  pinUsers=next;
  pinBusy=false;
  lockTill();
}
async function unlockTill(form){
  const status=$('#pin-login-status'), pin=val('pin-login-code');
  if(Date.now()<retryAt){status.textContent='Too many attempts. Wait 30 seconds and try again.';return}
  const user=pinUsers.find(u=>u.slot===Number(val('pin-person')));
  if(!user||!validPin(pin)||await pinHash(pin,user.salt)!==user.hash){
    failedPins++;
    if(failedPins>=5){retryAt=Date.now()+30000;failedPins=0;status.textContent='Too many attempts. Wait 30 seconds and try again.'}
    else status.textContent='That PIN does not match the selected name.';
    form.querySelector('#pin-login-code').value='';
    return;
  }
  failedPins=0;retryAt=0;pinUser=user;S.by=user.name;
  pinHeader();render();
}

document.addEventListener('submit',async e=>{
  const form=e.target;
  if(form.id!=='pin-login'&&form.id!=='pin-setup')return;
  e.preventDefault();if(pinBusy)return;
  pinBusy=true;
  const button=form.querySelector('button[type="submit"]');button.disabled=true;
  try{
    if(form.id==='pin-setup')await savePins();
    else await unlockTill(form);
  }catch(e){
    const status=form.querySelector('[role="status"]');
    if(status)status.textContent='Could not complete PIN setup or login. Check that this browser allows local storage.';
  }finally{pinBusy=false;button.disabled=false}
});

loadLocal();
S.loaded={products:1,sales:1,invoices:1};
pinHeader();
render();
